[package]
name = "adapter-onedrive-reference"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Runs the conformance suite against the OneDriveForLinux FUSE client"

# Pinned rather than tracking main, so a conformance result names a specific
# client. Currently the commit that fixed 5.3, 5.7 and 5.8 (PR #55); the run
# against the client as it was when the contract was written (f1f090c) is
# recorded in DESIGN.md §10.
[dependencies]
hydration-conformance = { path = "../../conformance" }
vfs = { git = "https://github.com/franzjeger/OneDriveForLinux", rev = "a6312a8" }
sync-engine = { git = "https://github.com/franzjeger/OneDriveForLinux", rev = "a6312a8" }
graph-client = { git = "https://github.com/franzjeger/OneDriveForLinux", rev = "a6312a8", features = ["test-util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs"] }
wiremock = "0.6"
serde_json = "1"
chrono = "0.4"
fuse3 = { version = "0.7", features = ["tokio-runtime", "unprivileged"] }
tempfile.workspace = true
anyhow = "1"
