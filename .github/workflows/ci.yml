name: CI

# The filesystem matrix is the point of this file.
#
# This framework is a claim about filesystem semantics, and two filesystems have
# already disagreed with each other in a way that cost real debugging: on ext4
# with a 128-byte inode a placeholder's identity attributes do not fit in the
# inode and spill into a block of their own, so `st_blocks` reports 2 for a file
# that holds nothing — the same number it reports for a file with a byte in it.
# Four tests and one production guard were written against `st_blocks == 0` and
# were wrong everywhere except btrfs.
#
# Nobody found that by reading. A second machine found it on its first run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Cheap, fails fast, and says which of the three gates it was.
  gate:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The `http` feature pulls in a TLS stack and is off by default, so it is
      # the configuration least likely to be built by hand and most likely to
      # rot.
      - name: cargo clippy, all features
        run: cargo clippy -p hydration-graph --all-features --all-targets -- -D warnings

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Everything that does not need root or a real filesystem.
  unprivileged:
    name: tests (no root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast
      - name: with the http feature
        run: cargo test -p hydration-graph --all-features --no-fail-fast

  # The suites that need CAP_SYS_ADMIN and a real mount, on filesystems that
  # disagree with each other.
  #
  # `HYDRATIOND_REQUIRE=1` and `HYDRATION_REQUIRE=1` turn a skip into a failure.
  # Without them a runner without the capability reduces the whole suite to a
  # no-op that reports success, which is worse than not running it: it is a
  # green tick over nothing.
  privileged:
    name: privileged (${{ matrix.fs.name }})
    # Pinned, not `-latest`, because this job has a kernel floor and `-latest`
    # moves without warning. Pre-content events are a 6.14 feature (March 2025);
    # ubuntu-24.04 currently ships 6.17-azure and ubuntu-22.04 ships 6.8, which
    # cannot run this suite at all. The probe below catches a migration that
    # breaks the floor, and this pin means it should not happen by surprise.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fs:
          # btrfs keeps extended attributes in its metadata tree, so a
          # placeholder reports zero blocks.
          - name: btrfs
            mkfs: mkfs.btrfs -q -f
            pkg: btrfs-progs
          # ext4 with a 128-byte inode cannot hold them there. This is the
          # configuration that found the bug.
          - name: ext4-128
            mkfs: mkfs.ext4 -q -F -I 128
            pkg: e2fsprogs
          # And with room to spare, so the difference is attributable to the
          # inode size rather than to ext4.
          - name: ext4-512
            mkfs: mkfs.ext4 -q -F -I 512
            pkg: e2fsprogs
          # xfs, and this list is not a preference. The kernel gates pre-content
          # events on a per-filesystem opt-in (`SB_I_ALLOW_HSM`), and exactly
          # three filesystems set it: ext4, btrfs and xfs. There is no fourth to
          # add, and tmpfs and FUSE are not omissions.
          - name: xfs
            mkfs: mkfs.xfs -q -f
            pkg: xfsprogs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install ${{ matrix.fs.pkg }}
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.fs.pkg }}

      - name: build the capability probe
        run: gcc -O1 -Wall -Wextra -o /tmp/precontent probes/precontent.c

      - name: make a ${{ matrix.fs.name }} filesystem
        run: |
          truncate -s 2G "$RUNNER_TEMP/fs.img"
          ${{ matrix.fs.mkfs }} "$RUNNER_TEMP/fs.img"
          mkdir -p "$RUNNER_TEMP/mnt"
          sudo mount -o loop "$RUNNER_TEMP/fs.img" "$RUNNER_TEMP/mnt"
          sudo chmod 777 "$RUNNER_TEMP/mnt"
          # mkfs.ext4 leaves a root-owned lost+found that makes every directory
          # walk fail with EACCES for the test user.
          sudo rm -rf "$RUNNER_TEMP/mnt/lost+found"
          mountpoint "$RUNNER_TEMP/mnt"
          # Recorded so a failure can be read against the right numbers.
          stat -f -c 'blocksize=%s' "$RUNNER_TEMP/mnt"

      # Ask the kernel, on the mount that will actually be used, whether the
      # thing this framework is built on exists here. Grepping the headers
      # would not answer it: <linux/fanotify.h> ships in a package and can
      # easily define constants the running kernel has never implemented.
      #
      # Failing here names the reason. Failing thirty tests later looks like a
      # bug in the code, and someone spends a day on it.
      - name: can this kernel do pre-content events?
        run: |
          uname -r
          sudo /tmp/precontent "$RUNNER_TEMP/mnt" && exit 0
          case $? in
            1) echo "::error::this kernel has no usable pre-content events; the privileged suite cannot mean anything here" ;;
            2) echo "::error::no CAP_SYS_ADMIN even under sudo" ;;
            3) echo "::error::${{ matrix.fs.name }} cannot carry a FAN_PRE_ACCESS mark" ;;
          esac
          exit 1

      # `HYDRATION_TEST_DIR` is what decides which filesystem the tests write
      # to, and it has to be a runtime variable.
      #
      # The obvious spelling — exporting CARGO_TARGET_TMPDIR — does nothing.
      # That is a compile-time macro and cargo sets it itself from the target
      # directory, so the export is silently discarded, measured:
      #
      #   CARGO_TARGET_TMPDIR=/mnt/elsewhere cargo test  ->  ./target/tmp
      #   CARGO_TARGET_DIR=/mnt/elsewhere cargo test     ->  /mnt/elsewhere/tmp
      #
      # Written the obvious way, all four legs of this matrix would run on the
      # runner's own disk and report green. That is not a matrix with a bug in
      # it; it is four identical jobs wearing four different names.
      - name: tests on ${{ matrix.fs.name }}
        run: cargo test --workspace --no-fail-fast
        env:
          # A subdirectory, not the mount root: `smoke.sh` below uses the mount
          # as a sync root and expects it empty. Sharing it made the delta pass
          # try to reconcile 34 files of test residue and fail — found by
          # running these steps in order locally, which is the only way it shows
          # up.
          HYDRATION_TEST_DIR: ${{ runner.temp }}/mnt/tests

      # And prove the variable was load-bearing rather than decorative: if the
      # suite passes with it pointed somewhere unwritable, it was never reading
      # it, and every green leg above meant nothing.
      - name: the matrix is not decorative
        run: |
          mkdir -p "$RUNNER_TEMP/unwritable" && chmod 555 "$RUNNER_TEMP/unwritable"
          if HYDRATION_TEST_DIR="$RUNNER_TEMP/unwritable" \
             cargo test -p hydration-client --no-fail-fast >/dev/null 2>&1; then
            echo "::error::the suite passed with its scratch directory unwritable, so it never used HYDRATION_TEST_DIR and this matrix tests one filesystem four times"
            exit 1
          fi
          echo "ok: the suite genuinely follows HYDRATION_TEST_DIR"

      - name: privileged suites on ${{ matrix.fs.name }}
        run: sudo -E ./deploy/run-privileged-tests.sh "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/fs.img"
        env:
          HYDRATIOND_REQUIRE: "1"
          HYDRATION_REQUIRE: "1"

      # Last, because it detaches the mount on the way out — that is one of the
      # things it asserts. Everything above has to have run already.
      - name: end to end
        run: |
          # An empty sync root. The steps above left theirs here.
          sudo find "$RUNNER_TEMP/mnt" -mindepth 1 -delete
          sudo -E ./deploy/smoke.sh "$RUNNER_TEMP/mnt"

      - name: what the mount looked like when it failed
        if: failure()
        run: |
          mount | grep "$RUNNER_TEMP/mnt" || true
          ls -la "$RUNNER_TEMP/mnt" || true
          dmesg | tail -40 || true

      - name: unmount
        if: always()
        run: sudo umount -l "$RUNNER_TEMP/mnt" || true

  # The probes are measurements the design document quotes. If one stops
  # reproducing, a claim in DESIGN.md has become false and somebody should hear
  # about it.
  probes:
    name: probes still compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ptprobe.c is the FUSE passthrough comparison and needs libfuse3's
      # headers even to parse.
      - name: install libfuse3-dev
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      # Compiled, not linked: what would actually break here is a header
      # changing under a probe, which the compile catches and a link failure
      # would only obscure behind a missing library.
      - name: every probe still compiles
        run: |
          fail=0
          for c in probes/*.c; do
            if gcc -fsyntax-only -Wall -Wextra "$c"; then
              echo "ok   $c"
            else
              echo "::error file=$c::probe no longer compiles against current headers"
              fail=1
            fi
          done
          exit $fail
